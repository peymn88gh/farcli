[package]
name = "farcli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Read and type Farsi correctly in Claude Code CLI and Codex CLI"
license = "MIT"
repository = "https://github.com/peymn88gh/farcli"

# Cargo.lock holds some Windows support crates at older versions on purpose
# (parking_lot, parking_lot_core, polling, home, miow). Their newest versions,
# and windows-sys from 0.61, need `dlltool` and an assembler to build with the
# `x86_64-pc-windows-gnu` toolchain. Running `cargo update` without those
# tools installed breaks the build.

[dependencies]
# Plumbing only: turns a Target app's drawing codes into the Hidden screen.
alacritty_terminal = { version = "0.26", default-features = false }
# Plumbing only: the Unicode table of which way each character runs.
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data"] }

[target.'cfg(windows)'.dependencies]
# Plumbing only: the hidden terminal (ConPTY) and the Terminal's own console.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    # The hidden terminal's input: a pipe that keeps writes apart.
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    # Setup: installing the Farsi font for the current user.
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
